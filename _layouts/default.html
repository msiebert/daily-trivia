<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | strip_newlines }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#7a3b2e">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/icons/icon-512.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">
          <span class="site-title-mark">✦</span>
          {{ site.title }}
        </a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Journal</a>
          <a href="{{ '/categories/' | relative_url }}">Categories</a>
          <a href="{{ '/quiz/' | relative_url }}">Quiz</a>
          <a href="{{ '/my-facts/' | relative_url }}">My Facts</a>
          <a href="{{ '/getting-started/' | relative_url }}">Getting Started</a>
        </nav>
        {% include auth-controls.html %}
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>A quiet daily habit of learning five new things.</p>
    </footer>
  </div>

  <div class="install-banner" role="dialog" aria-label="Install 5 Things">
    <img class="install-banner-icon" src="{{ '/assets/icons/icon-192.png' | relative_url }}" alt="">
    <div class="install-banner-body">
      <p class="install-banner-title">Install {{ site.title }}</p>
      <p class="install-banner-copy"></p>
    </div>
    <button type="button" class="install-banner-action" hidden>Install</button>
    <button type="button" class="install-banner-dismiss" aria-label="Dismiss">&times;</button>
  </div>
  <script src="{{ '/assets/js/install-banner.js' | relative_url }}" defer></script>
  <script type="module" src="{{ '/assets/js/auth.js' | relative_url }}"></script>
  <script type="module" src="{{ '/assets/js/collection.js' | relative_url }}"></script>
  <script type="module" src="{{ '/assets/js/stats.js' | relative_url }}"></script>
</body>
</html>
